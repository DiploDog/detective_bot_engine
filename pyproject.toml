[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "detective-bot"
version = "0.1.0"
description = "Platform-independent engine for interactive detective games"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2,<3",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
