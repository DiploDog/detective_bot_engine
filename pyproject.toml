[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "detective-bot"
version = "0.1.0"
description = "Platform-independent engine for interactive detective games"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiogram==3.30.0",
    "alembic>=1.13,<2",
    "asyncpg>=0.29,<1",
    "pydantic>=2.13.4,<3",
    "PyYAML>=6,<7",
    "sqlalchemy>=2,<3",
    "vkbottle==4.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
