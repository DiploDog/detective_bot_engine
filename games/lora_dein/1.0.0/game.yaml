schema_version: 1
entry_scene: lora_scene1

variables:
  wrong_scene1:
    type: integer
    default: 0
  wrong_scene2:
    type: integer
    default: 0
  wrong_scene3:
    type: integer
    default: 0

scheduled_actions: {}

scenes:
  lora_scene1:
    on_enter:
      - type: text
        text: |-
          🕵️‍♀️ ДЕТЕКТИВНОЕ ДЕЛО: УБИЙСТВО ЛОРЫ ДЕЙН

          Томми Вайс обвиняется в убийстве актрисы Лоры Дейн. Ваша задача - найти 2 улики, доказывающие его невиновность.

          📋 ВОЗМОЖНЫЕ УЛИКИ:
          1. 🍻 Томми был в баре Golden Lion в момент убийства
          2. 👞 Размер обуви Томми не совпадает с найденным в гримерке
          3. 🍳 Томми завтракал с Лорой, когда кто-то прошел по ее пропуску
          4. ☠️ Крысиный яд был куплен по просьбе Лоры
          5. 🎬 Томми работал на другой студии
          6. 💔 Томми не знал об изменах Лоры (нет мотива)

          Выберите номера улик и напишите их через запятую:
    interactions:
      - id: choose_evidence
        input:
          type: numeric_selection
          separators: [comma, whitespace, word_and]
          unique: true
          min_items: 2
          max_items: 2
          allowed_values: [1, 2, 3, 4, 5, 6]
        outcomes:
          - id: invalid_format
            when: invalid
            actions:
              - type: text
                text: "❌ Пожалуйста, введите точное количество ответов из списка (от 1 до 6) через запятую или пробел."
            transition: stay

          - id: correct_evidence
            when:
              selection:
                equals: [1, 3]
            actions:
              - type: text
                text: "🎉 Поздравляю, вам удалось оправдать невиновного! Сможете ли вы найти тех, у кого был мотив? Открывайте дополнительный конверт №1!"
            transition:
              goto: lora_scene2

          - id: feedback_1_2
            when:
              selection:
                equals: [1, 2]
            actions:
              - type: text
                text: |-
                  Томми действительно был в баре Golden Lion в момент убийства. Вы наверняка заметили, что он отсутствовал на камерах 33 минуты. Однако если вы сопоставили время в пути от бара до киностудии на карте, то вы догадались, что этого времени бы не хватило, чтобы добраться до Silver Screen и вернуться обратно.

                  Что касается размера обуви - мы не можем достоверно знать, что следы на месте преступления оставил убийца, поэтому не можем рассматривать данную улику как доказательство невиновности Томми. Попробуйте поискать другой вариант.
            effects:
              - type: increment
                variable: wrong_scene1
                by: 1
            transition:
              goto: lora_scene1

          - id: feedback_1_4
            when:
              selection:
                equals: [1, 4]
            actions:
              - type: text
                text: |-
                  Томми действительно был в баре Golden Lion в момент убийства. Вы наверняка заметили, что он отсутствовал на камерах 33 минуты. Однако если вы сопоставили время в пути от бара до киностудии на карте, то вы догадались, что этого времени бы не хватило, чтобы добраться до Silver Screen и вернуться обратно.

                  Что касается яда - поскольку у нас нет судмедэкспертизы, мы не можем наверняка говорить о том, что Лора была отравлена крысиным ядом. Поэтому советую тебе поискать вторую улику внимательнее, детектив!
            effects:
              - type: increment
                variable: wrong_scene1
                by: 1
            transition:
              goto: lora_scene1

          - id: feedback_1_5
            when:
              selection:
                equals: [1, 5]
            actions:
              - type: text
                text: |-
                  Томми действительно был в баре Golden Lion в момент убийства. Вы наверняка заметили, что он отсутствовал на камерах 33 минуты. Однако если вы сопоставили время в пути от бара до киностудии на карте, то вы догадались, что этого времени бы не хватило, чтобы добраться до Silver Screen и вернуться обратно.

                  Томми работал на студии Golden Rain, ты абсолютно прав! Но что, если он проник на студию другим способом? Найти способ доказать, что он не мог туда попасть!
            effects:
              - type: increment
                variable: wrong_scene1
                by: 1
            transition:
              goto: lora_scene1

          - id: feedback_1_6
            when:
              selection:
                equals: [1, 6]
            actions:
              - type: text
                text: |-
                  Томми действительно был в баре Golden Lion в момент убийства. Вы наверняка заметили, что он отсутствовал на камерах 33 минуты. Однако если вы сопоставили время в пути от бара до киностудии на карте, то вы догадались, что этого времени бы не хватило, чтобы добраться до Silver Screen и вернуться обратно.

                  Отсутствие мотива не является весомой уликой в оправдании Томми, попробуй подумать в другом направлении.
            effects:
              - type: increment
                variable: wrong_scene1
                by: 1
            transition:
              goto: lora_scene1

          - id: feedback_2_3
            when:
              selection:
                equals: [2, 3]
            actions:
              - type: text
                text: |-
                  Ты верно отметил! Кто-то мог пробраться в гримерку Лоры по ее потерянному пропуску в 7 утра и устроить все для убийства. Однако это точно был не Томми, ведь в это время он завтракал с Лорой.

                  Что касается размера обуви - мы не можем достоверно знать, что следы на месте преступления оставил убийца, поэтому не можем рассматривать данную улику как доказательство невиновности Томми. Попробуйте поискать другой вариант.
            effects:
              - type: increment
                variable: wrong_scene1
                by: 1
            transition:
              goto: lora_scene1

          - id: feedback_3_4
            when:
              selection:
                equals: [3, 4]
            actions:
              - type: text
                text: |-
                  Ты верно отметил! Кто-то мог пробраться в гримерку Лоры по ее потерянному пропуску в 7 утра и устроить все для убийства. Однако это точно был не Томми, ведь в это время он завтракал с Лорой.

                  Что касается яда - поскольку у нас нет судмедэкспертизы, мы не можем наверняка говорить о том, что Лора была отравлена крысиным ядом. Поэтому советую тебе поискать вторую улику внимательнее, детектив!
            effects:
              - type: increment
                variable: wrong_scene1
                by: 1
            transition:
              goto: lora_scene1

          - id: feedback_3_5
            when:
              selection:
                equals: [3, 5]
            actions:
              - type: text
                text: "Ты верно отметил! Кто-то мог пробраться в гримерку Лоры по ее потерянному пропуску в 7 утра и устроить все для убийства. Однако это точно был не Томми, ведь в это время он завтракал с Лорой. Но мог ли он попасть на студию в другое время? Советую ознакомиться с уликами еще раз и ответить на вопрос еще раз."
            effects:
              - type: increment
                variable: wrong_scene1
                by: 1
            transition:
              goto: lora_scene1

          - id: feedback_3_6
            when:
              selection:
                equals: [3, 6]
            actions:
              - type: text
                text: |-
                  Ты верно отметил! Кто-то мог пробраться в гримерку Лоры по ее потерянному пропуску в 7 утра и устроить все для убийства. Однако это точно был не Томми, ведь в это время он завтракал с Лорой.

                  Отсутствие мотива не является весомой уликой в оправдании Томми, попробуй подумать в другом направлении.
            effects:
              - type: increment
                variable: wrong_scene1
                by: 1
            transition:
              goto: lora_scene1

          - id: generic_wrong_evidence
            when: otherwise
            actions:
              - type: text
                text: "❌ Хорошая попытка, но нужно найти минимум 2 настоящие улики! Попробуйте еще раз."
            effects:
              - type: increment
                variable: wrong_scene1
                by: 1
            transition:
              goto: lora_scene1

  lora_scene2:
    on_enter:
      - type: text
        text: |-
          🔍 ВТОРАЯ СЦЕНА: ПОИСК ПОДОЗРЕВАЕМЫХ

          Теперь нужно найти тех, у кого был мотив убить Лору Дейн.

          Список подозреваемых:
          1. Рита Морган
          2. Ван Ли
          3. Винсент Кроули
          4. Карл Брукс
          5. Томми Вайс
          6. Глория Фэрроу

          Выберите номера подозреваемых и напишите их через запятую:
    interactions:
      - id: choose_suspects
        input:
          type: numeric_selection
          separators: [comma, whitespace, word_and]
          unique: true
          min_items: 2
          max_items: 3
          allowed_values: [1, 2, 3, 4, 5, 6]
        outcomes:
          - id: invalid_format
            when: invalid
            actions:
              - type: text
                text: "❌ Пожалуйста, введите точное количество ответов из списка (от 1 до 6) через запятую или пробел."
            transition: stay

          - id: correct_suspects
            when:
              selection:
                subset_of: [1, 2, 6]
                size:
                  min: 2
                  max: 3
            actions:
              - type: text
                text: "🎉 Поздравляю, вам удалось найти подозреваемых! Сможете ли вы доказать их виновность? Открывайте дополнительный конверт №2"
            transition:
              goto: lora_scene3

          - id: wrong_suspects
            when: otherwise
            actions:
              - type: text
                text: "❌ Хорошая попытка, но нужно найти настоящих подозреваемых! Попробуйте еще раз."
            effects:
              - type: increment
                variable: wrong_scene2
                by: 1
            transition:
              goto: lora_scene2

  lora_scene3:
    on_enter:
      - type: text
        text: |-
          🔎 ТРЕТЬЯ СЦЕНА: ОПРЕДЕЛЕНИЕ УБИЙЦЫ

          Кто же все-таки убил Лору Дейн?

          Список подозреваемых:
          1. Рита Морган
          2. Ван Ли
          3. Винсент Кроули
          4. Карл Брукс
          5. Томми Вайс
          6. Глория Фэрроу

          Напишите номер убийцы:
    interactions:
      - id: choose_killer
        input:
          type: numeric_selection
          separators: [comma, whitespace, word_and]
          unique: true
          min_items: 1
          max_items: 1
          allowed_values: [1, 2, 3, 4, 5, 6]
        outcomes:
          - id: invalid_format
            when: invalid
            actions:
              - type: text
                text: "❌ Пожалуйста, введите точное количество ответов из списка (от 1 до 6) через запятую или пробел."
            transition: stay

          - id: correct_killer
            when:
              selection:
                equals: [6]
            actions:
              - type: text
                text: "🎉 Поздравляю, вам удалось определить убийцу! Вскрывайте последний конверт с признанием преступника!"
              - type: text
                text: "🎊 Вы успешно завершили расследование! Спасибо за игру!"
            transition: complete

          - id: wrong_killer
            when: otherwise
            actions:
              - type: text
                text: "❌ Хорошая попытка, но это не тот человек! Попробуйте еще раз."
            effects:
              - type: increment
                variable: wrong_scene3
                by: 1
            transition:
              goto: lora_scene3
