  margo_killer:
    on_enter:
      - type: text
        text: "Я в предвкушении! Итак, удиви меня!"
    interactions:
      - id: answer_killer
        input:
          type: text
          normalize: [trim, lowercase, collapse_whitespace, replace_yo]
        outcomes:
          - id: killer_correct
            when:
              match:
                strategy: aliases
                values: ["марк", "марк дэвис", "марк девис", "джейкоб адамс", "джейкоб", "адамс"]
            actions:
              - type: text
                text: "Я горжусь тобой, мой друг! Ты идеально справился с этим преступлением и вычислил убийцу. Если тебе интересно узнать историю целиком, то я вышлю тебе отчет полиции по этому делу. Там ты найдешь все детали по делу."
              - type: media
                asset: final_police_report
                caption: "Финальный полицейский отчет"
            transition: complete
          - id: killer_wrong
            when: otherwise
            actions:
              - type: text
                text: "Кажется, ты планируешь посадить невиновного?"
            transition: {goto: margo_killer_hint}

  margo_killer_hint:
    on_enter:
      - type: choices
        interaction: hint_killer
        text: "Друг, тебе нужна подсказка?"
    interactions:
      - id: hint_killer
        input:
          type: choice
          normalize: [trim, lowercase]
          options:
            "yes": {label: "Да", text_aliases: ["да"]}
            "no": {label: "Нет", text_aliases: ["нет"]}
        outcomes:
          - id: killer_accept_hint
            when: {choice: "yes"}
            actions:
              - type: text
                text: "Один человек из подозреваемых был у Елены во время убийства. Из допроса Джулиана и Саймона мы делаем вывод, что это был мужчина. У кого из мужчин нет алиби на время преступления?"
            transition: {goto: margo_killer}
          - id: killer_decline_hint
            when: {choice: "no"}
            actions:
              - type: text
                text: "Хорошо, попробуй ответить на вопрос еще раз."
            transition: {goto: margo_killer}
