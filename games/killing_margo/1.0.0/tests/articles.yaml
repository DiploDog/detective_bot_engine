name: all_articles
article_texts:
  article_1: &article_1 |-
    Дата и время: 10.10.2023, 22:15
    Запрос: «частные клиники лечение игровой зависимости Спрингфилд отзывы»
    Заголовок страницы: «Топ-5 частных клиник для лечения лудомании в Спрингфилде: сравнение программ и цен»
    СОДЕРЖАНИЕ СТАТЬИ (выдержка):
    «Клиника «Рехаб Центр» предлагает одну из самых строгих программ изоляции с полным запретом на доступ к деньгам и гаджетам. Стоимость 28-дневного курса начинается от $15 000. По словам бывших пациентов, программа эффективна, но требует полного согласия больного, иначе возможны срывы сразу после выписки.»
  article_2: &article_2 |-
    Дата и время: 11.10.2023, 09:40
    Запрос: «раздел имущества при разводе без брачного договора иллинойс»
    Заголовок страницы: «Как делится имущество при разводе в Иллинойсе: права супругов и типичные ошибки»
    СОДЕРЖАНИЕ СТАТЬИ (выдержка):
    «Страховые полисы, приобретенные в браке, считаются совместной собственностью. В случае смерти одного из супругов второй, как выгодоприобретатель, имеет право на выплату даже при подаче на развод, если полис не был переоформлен. Суды штата часто расценивают это как существенный актив при разделе.»
  article_3: &article_3 |-
    Дата и время: 12.10.2023, 10:30
    Запрос: «причины развода смерть супруга иллинойс»
    Заголовок страницы: «Развод и смерть супруга: как это влияет на имущество и страховые выплаты?»
    СОДЕРЖАНИЕ СТАТЬИ (выдержка):
    «Если во время бракоразводного процесса один из супругов умирает, дело о разводе прекращается, и вступают в силу правила наследования. Особенно сложны случаи, когда смерть наступила в результате несчастного случая или насилия. По статистике, около 5% разводов в Иллинойсе связаны с последующей гибелью одного из супругов в течение года.»
  article_4: &article_4 |-
    Дата и время: 12.10.2023, 11:45
    Запрос: «домашнее насилие статистика сша»
    Заголовок страницы: «Статистика домашнего насилия в США: цифры и резонансные дела»
    СОДЕРЖАНИЕ СТАТЬИ (выдержка):
    «По данным Национальной коалиции против домашнего насилия, ежегодно в США от рук интимных партнеров погибает около 1500 женщин. Однако не менее трагичны случаи, когда жертвами становятся и мужчины. Одно из громких дел последних лет — процесс над Джейкобом Адамсом, который в 2016 году был осужден за убийство своего соседа по квартире во время бытовой ссоры. Это дело привлекло внимание общественности к проблеме неконтролируемой агрессии в семейных конфликтах. После освобождения Адамс сменил имя и, предположительно, переехал в другой штат.»
  article_5: &article_5 |-
    Дата и время: 12.10.2023, 20:17
    Запрос: «что считается доказательством домогательств на работе запись разговора»
    Заголовок страницы: «Тайная запись разговора как доказательство харассмента: законность и сила в суде»
    СОДЕРЖАНИЕ СТАТЬИ (выдержка):
    «В штате Иллинойс разрешена односторонняя аудиозапись разговора. Такое доказательство является допустимым в суде и часто становится решающим, особенно если на записи четко слышно «услуга за услугу» — предложение каких-либо преимуществ в обмен на личные услуги.»
  article_6: &article_6 |-
    Дата и время: 13.10.2023, 11:05
    Запрос: «Jacob Adams Oakville 2016 приговор»
    Заголовок страницы: «Приговор по делу Джейкоба Адамса: 7 лет за непредумышленное убийство в состоянии аффекта»
    СОДЕРЖАНИЕ СТАТЬИ:
    «...Суд города Оквилл вынес приговор 28-летнему Джейкобу Адамсу. Подсудимый был признан виновным в непредумышленном убийстве своего соседа по квартире, 30-летнего Карлоса Риверы, во время бытовой ссоры в апреле 2015 года. Как установило следствие, конфликт начался из-за денежного долга и перерос в драку, в ходе которой Адамс нанёс Ривере несколько ударов кухонным ножом. Защита настаивала на самообороне и состоянии сильного душевного волнения. Суд принял во внимание чистую до этого репутацию подсудимого, его раскаяние и то, что он немедленно вызвал полицию, но отметил чрезмерную жестокость и применение ножа. Джейкоб Адамс приговорён к 7 годам лишения свободы с правом на условно-досрочное освобождение после отбытия двух третей срока...»
  article_7: &article_7 |-
    Дата и время: 13.10.2023, 11:20
    Запрос: «условно-досрочное освобождение Иллинойс условия»
    Заголовок страницы: «Комиссия по условно-досрочному освобождению: процедура и критерии»
    СОДЕРЖАНИЕ СТАТЬИ (выдержка):
    «Лица, осужденные за насильственные преступления, такие как непредумышленные, могут претендовать на условно-досрочное освобождение после отбытия не менее 2/3 срока при образцовом поведении, признании вины и наличии утвержденного плана реинтеграции, включая место жительства и работу.»
  article_8: &article_8 |-
    Дата и время: 13.10.2023, 19:30
    Запрос: «рецепт домашней пиццы пепперони с тонким тестом»
    Заголовок страницы: «Идеальная домашняя пицца с пепперони: пошаговый рецепт»
    СОДЕРЖАНИЕ СТАТЬИ (выдержка):
    «Секрет хрустящего тонкого теста — в высокотемпературной выпечке (минимум 250°C) и минимальном количестве начинки. Раскатайте тесто как можно тоньше, смажьте томатным соусом с орегано, выложите пепперони и обильно посыпьте тертой моцареллой. Выпекайте 10-12 минут до золотистого края.»
  article_9: &article_9 |-
    Дата и время: 14.10.2023, 15:10
    Запрос: «Springfield FC Chicago Fire прогноз ставки»
    Заголовок страницы: «Прогноз на матч MLS: Springfield FC против Chicago Fire. Кого брать в ставках?»
    СОДЕРЖАНИЕ СТАТЬИ (выдержка):
    «Несмотря на статус явного аутсайдера (коэф. на победу 2.10), Springfield FC может преподнести сюрприз на домашнем поле. Матч начнется в 19:00 и, вероятно, будет богат на голевые моменты во втором тайме. Букмекеры советуют осторожность, но ставка на тотал больше 2.5 выглядит оправданной.»
  article_10: &article_10 |-
    Дата и время: 14.10.2023, 16:55
    Запрос: «как проверить подлинность рецептурного бланка водяные знаки»
    Заголовок страницы: «Руководство для фармацевтов: 5 уровней защиты официальных рецептурных бланков»
    СОДЕРЖАНИЕ СТАТЬИ (выдержка):
    «Наиболее надежный способ отличить подделку — проверить бланк под ультрафиолетом: оригинал должен иметь скрытые UV-метки с логотипом штата. Также обратите внимание на микрошрифт в нижнем углу и тактильные ощущения от бумаги — оригинальная имеет легкую шероховатость.»
  article_11: &article_11 |-
    Дата и время: 14.10.2023, 18:40 (ПОСЛЕДНЯЯ ЗАПИСЬ)
    Запрос: «номер доставки пиццы Cheesus Crust спрингфилд»
    Заголовок страницы: «Cheesus Crust — отслеживание заказа»
    СОДЕРЖАНИЕ СТАТЬИ (выдержка):
    «Для отслеживания статуса вашего заказа введите его номер в поле ниже. Среднее время доставки в районе Maple Street составляет 30-40 минут в вечернее время.»

