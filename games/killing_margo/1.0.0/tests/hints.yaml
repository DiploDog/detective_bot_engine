name: all_hint_flows
scenarios:
  - name: q1_hint_yes
    initial: {scene: margo_q1}
    steps:
      - input: {text: "да"}
        expect: {outcome: q1_wrong, scene: margo_q1_hint}
      - input: {choice: {interaction: hint_q1, value: "yes"}}
        expect:
          outcome: q1_accept_hint
          scene: margo_q1
          actions:
            - {type: text, exact: "Кажется, ты невнимательно ознакомился с судмедэкспертизой. Попробуй поискать там."}
            - {type: text, contains: "наследил ботинками"}
  - name: q1_hint_no
    initial: {scene: margo_q1}
    steps:
      - input: {text: "да"}
        expect: {scene: margo_q1_hint}
      - input: {choice: {interaction: hint_q1, value: "no"}}
        expect:
          outcome: q1_decline_hint
          scene: margo_q1
          actions:
            - {type: text, exact: "Хорошо, попробуй ответить на вопрос еще раз."}
            - {type: text, contains: "наследил ботинками"}

