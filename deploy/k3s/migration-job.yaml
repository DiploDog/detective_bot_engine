apiVersion: batch/v1
kind: Job
metadata:
  name: detective-bot-migrate
  labels:
    app.kubernetes.io/name: detective-bot-migrate
    app.kubernetes.io/part-of: detective-bot
    detective-bot.io/deployment-phase: migration
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: detective-bot-migrate
        app.kubernetes.io/part-of: detective-bot
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: detective-bot-image
          imagePullPolicy: IfNotPresent
          command:
            - alembic
            - upgrade
            - head
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: detective-bot-secrets
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
