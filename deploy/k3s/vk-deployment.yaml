apiVersion: apps/v1
kind: Deployment
metadata:
  name: detective-bot-vk
  labels:
    app.kubernetes.io/name: detective-bot-vk
    app.kubernetes.io/part-of: detective-bot
    detective-bot.io/deployment-phase: application
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: detective-bot-vk
  template:
    metadata:
      labels:
        app.kubernetes.io/name: detective-bot-vk
        app.kubernetes.io/part-of: detective-bot
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vk
          image: detective-bot-image
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -m
            - detective_bot.entrypoints.vk
          envFrom:
            - configMapRef:
                name: detective-bot-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: detective-bot-secrets
                  key: DATABASE_URL
            - name: VK_GROUP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: detective-bot-secrets
                  key: VK_GROUP_TOKEN
            - name: VK_GROUP_ID
              valueFrom:
                secretKeyRef:
                  name: detective-bot-secrets
                  key: VK_GROUP_ID
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
